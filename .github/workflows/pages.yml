# Publica la página de la empresa en GitHub Pages (versión estática).
# Requiere: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Página en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['src/views/**', 'src/home.js', 'src/pricing.js', 'public/css/site.css', 'public/js/cotizador.js', 'public/img/**', 'pages/**', 'scripts/build-pages.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-pages.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
