<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13294b">
  <title>Mis envíos</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand-link" aria-label="Página de la empresa"><img class="brand-logo" src="/img/logo-light.png" alt="AN Mobility Group"></a>
    <div class="brand" id="brand">Mis envíos</div>
    <button class="btn-sm" id="btn-refresh" title="Actualizar">↻</button>
    <button class="btn-sm" id="btn-menu">Menú</button>
  </header>
  <nav class="tabs">
    <button class="active" data-tab="open">En curso</button>
    <button data-tab="closed">Historial</button>
  </nav>

  <main class="container narrow">
    <div id="banners"></div>
    <div id="list"></div>
  </main>

  <dialog id="menu">
    <div class="dialog-body">
      <h2 id="menu-name"></h2>
      <p class="muted small" id="menu-email"></p>
      <div style="display:grid;gap:8px">
        <button id="menu-push">🔔 Activar notificaciones</button>
        <a class="btn" href="/#cotizar">📦 Solicitar un nuevo envío</a>
        <button id="menu-password">🔑 Cambiar contraseña</button>
        <button id="menu-logout" class="btn-danger">Salir</button>
      </div>
      <div class="dialog-actions"><button class="btn-primary" data-close>Cerrar</button></div>
    </div>
  </dialog>

  <script src="/js/common.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
