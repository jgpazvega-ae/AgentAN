<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13294b">
  <title>Iniciar sesión · AN Mobility Group</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="card auth-card">
      <a href="/" class="auth-logo-link"><img class="auth-logo" src="/img/logo.png" alt="AN Mobility Group"></a>
      <h1 id="title" style="text-align:center">Iniciar sesión</h1>
      <p id="subtitle" class="muted small" style="text-align:center">Acceso para choferes y administración</p>

      <form id="login-form">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div id="login-msg"></div>
        <button class="btn-primary btn-big" style="margin-top:16px">Entrar</button>
      </form>

      <form id="setup-form" class="hidden">
        <div class="alert alert-info">Primera vez: crea la cuenta del administrador (dueño o encargado de asignar viajes).</div>
        <label for="s-name">Tu nombre</label>
        <input id="s-name" name="name" required>
        <label for="s-email">Correo</label>
        <input id="s-email" name="email" type="email" autocomplete="username" required>
        <label for="s-password">Contraseña (mínimo 8 caracteres)</label>
        <input id="s-password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        <div id="setup-msg"></div>
        <button class="btn-primary btn-big" style="margin-top:16px">Crear cuenta</button>
      </form>
      <p class="small" style="text-align:center;margin-top:16px"><a href="/">← Volver a la página de la empresa</a></p>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const go = (home) => {
      const back = params.get('volver');
      location.href = back && back.startsWith('/') && !back.startsWith('//') ? back : home;
    };

    (async () => {
      registerServiceWorker();
      const cfg = await api('/config');
      document.title = `Iniciar sesión · ${cfg.companyName}`;
      if (cfg.needsSetup) {
        $('#title').textContent = 'Configuración inicial';
        $('#login-form').classList.add('hidden');
        $('#setup-form').classList.remove('hidden');
        return;
      }
      try {
        const me = await fetch('/api/me').then((r) => (r.ok ? r.json() : null));
        if (me) go(me.home);
      } catch {}
    })();

    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const btn = f.querySelector('button');
      btn.disabled = true;
      try {
        const res = await api('/login', { method: 'POST', body: { email: f.email.value, password: f.password.value } });
        go(res.home);
      } catch (err) {
        showError($('#login-msg'), err);
        btn.disabled = false;
      }
    });

    $('#setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      try {
        await api('/setup', { method: 'POST', body: { name: f.elements.name.value, email: f.email.value, password: f.password.value } });
        location.href = '/admin.html';
      } catch (err) {
        showError($('#setup-msg'), err);
      }
    });
  </script>
</body>
</html>
